<!--HTML entities
1) it's a piece of text(string) that begins with amperstand(&) and ends with a semicolen(;)
2) it is used to show text which are reserved characters will will otherwise be interprited as html code
3)and invisible characters like unbreaking spaces
4)special symbols-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML entities</title>
</head>
<body>
    <p>a &lt; b</p>
    <p>a &gt; b</p>
    <p>a &amp; b</p>
    <p>a &quot;b&quot;</p>
</body>
</html>
