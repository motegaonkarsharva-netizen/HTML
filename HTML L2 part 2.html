<!--sementic markup

eg-left side of wikipedia page
5)article-
6)section- to group together relevent content

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

</head>
<body>

        </nav>
    </header>

    <main>
        This is my main content.
    </main>

    <footer>
        Made with &hearts;

</html>
