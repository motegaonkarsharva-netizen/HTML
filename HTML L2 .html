<!--Div element
its a container to hold other elements or group elements together
it's a block element-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div element</title>
</head>
<body>
    <div>
        <a href="https://www.google.com">Google</a>
        <a href="https://www.youtube.com/">Youtube</a>

    </div>
    <a href="https://www.facebook.com">facebook</a>
</body>
</html>

<!--Span element
just like div element but its a inline element-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div element</title>
</head>
<body>
    <span>
        <a href="https://www.google.com">Google</a>
        <a href="https://www.youtube.com/">Youtube</a>

    </span>
    <a href="https://www.facebook.com">facebook</a>
</body>
</html>   <!--we can see that -->
